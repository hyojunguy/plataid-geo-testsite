<p><strong>안내:</strong> 이 사이트는 실존 회사가 아닙니다. PlatAid(AI Discovery OS)의 생성형 검색 노출 측정·개선 실험을 위해 운영하는 가상 브랜드 테스트 사이트입니다.</p>
<h1>Lumora Notes</h1>
<p>회의 녹음과 메모를 팀 회의록으로 정리해 주는 가상의 협업 도구입니다.</p>
<h2>주요 기능</h2>
<ul>
<li>회의 메모를 안건·결정·할 일로 자동 정리</li>
<li>팀 공유 폴더와 검색</li>
</ul>
<h2>요금</h2>
<p>테스트용 가상 브랜드이므로 실제 판매하지 않습니다.</p>
